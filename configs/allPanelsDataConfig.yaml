allPanelsData:
  - panelName: "Tecnologias abertas para políticas públicas"
    title: "Tecnologias abertas para políticas públicas"
    typeOfActivity: "Painel"
    category: "Tecnologia"
    nivel: "Intermediário"
    experienceOnOpenSource: "Média"
    language: "Português"
    facilitatingPerson:
      - name: "Mário Sérgio"
        bio: "Mário Sérgio atualmente é de desenvolvedor de software em um produto de turismo, também foi Coordenador Geral de Participação Digital na Presidência da República. Ex coordenador do Programa de Inovação Cívica da Open Knowledge Brasil e um dos mantenedores da Operação Serenata de Amor. Ex-presidente da Associação Python Brasil. Em 2017 foi nomeado fellow member da Python Software Foundation nos Estados Unidos."
        photoUrl: "https://github.com/cumbucadev/NOSS/raw/main/2026/assets/images/participantes/mario-sergio.jpg"
        pronouns: "Ele/Dele"
        linkedIn: "https://www.linkedin.com/in/sergiomarioq/"
        github: "https://github.com/sergiomario"
    participatingPeople:
      - name: "Yaso"
        bio: "Sou uma pessoa eternamente preocupada com as consequências do uso inconsequente de dados pessoais e com a forma como tecnologias moldam o tecido social e o bem-estar das pessoas. Tenho interesse especial por tecnologias deixadas de lado em prol de modelos mais lucrativos, como Privacy-Enhancing Technologies (PETs), identidade digital e infraestrutura aberta. Sou mãe solo, usuária de Debian e atuo na interseção entre IAM, privacidade, segurança e interesse público. Já passei por instituições como o W3C, o Banco Mundial e a Harvard University, além de experiências no governo, sociedade civil e iniciativa privada."
        photoUrl: "https://github.com/cumbucadev/NOSS/raw/main/2026/assets/images/participantes/yaso.png"
        pronouns: "Não uso pronomes"
        linkedIn: "https://www.linkedin.com/in/yasodara/"
        github: "https://github.com/yaso"
      - name: "Carla Rocha"
        bio: "Sou professora no curso de Engenharia de Software na Universidade de Brasília (UnB). Tenho mais de 10 anos de experiência prática e acadêmica com desenvolvimento de software, DevOps, MLOps, engenharia de dados e plataformas digitais, com interesse particular em software livre, impacto social e inovação no setor público. Coordeno o Lab Livre – Laboratório de Competência em Software Livre, onde lidero projetos de pesquisa, desenvolvimento e inovação. Tenho ampla experiência em parcerias com órgãos governamentais, e formação de estudantes através de projetos práticos e colaborativos. Co-fundei o programa de mentoria BOSS, para fazer o onboarding de pessoas de grupos subrepresentados em comunidades de software livre, programa premiado pela Gnome Community Engagement Challenge."
        photoUrl: "https://github.com/cumbucadev/NOSS/raw/main/2026/assets/images/participantes/carla-rocha.jpg"
        pronouns: "ela/dela"
        linkedIn: "https://www.linkedin.com/in/carla-rocha-a4287a19/"
        github: "https://github.com/RochaCarla"
      - name: "Cuducos"
        bio: "Cuducos trabalha no time de engenharia do Bluesky, desenvolvendo tecnologias abertas e descentralizadas para a conversa pública. Com doutorado em sociologia, aproxima tecnologia, cultura e política com um olhar de tecnologia como ativismo. Participou da fundação da Operação Serenata de Amor e criou projetos como Minha Receita e Arrobas Pralamentar. Também atuou em organizações como Shopify, World Bank, Open Knowledge Brasil e Jusbrasil."
        photoUrl: "https://github.com/cumbucadev/NOSS/raw/main/2026/assets/images/participantes/cuducos.jpg"
        pronouns: "Não uso pronomes"
        linkedIn: "https://linkedin.com/in/cuducos"
        github: "https://github.com/cuducos"
