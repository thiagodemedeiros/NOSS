keynotes:
    name: "Paloma Oliveira"
    id: "1"
    bio: "Como tecnologista da Sovereign Tech Agency, contribuo para a definição de infraestruturas digitais abertas essenciais para a soberania digital global, bem como seu fortalecimento através de investimentos diretos e diversos programas.\n\nEngajada na exploração crítica das intersecções entre arte, tecnologia, minha perspectiva é socio-técnica-ecológica: tecnologia não é neutra, e as escolhas sobre quem a mantém, como é governada e por quem é acessada têm consequências profundas para a autonomia coletiva, incluindo não humanos. Envolvida na governança e organização de comunidades FOSS como membra do conselho do Python Software Verband, integrante de program committees da Open JS Foundation, FOSS Backstage e PyCon DE & PyData, e organizadora das PyLadies Alemanha, co-fundadora do Zentrum für Netzkunst (centro para a net arte), onde esse compromisso com tecnologia, equidade e cuidado encontra sua dimensão cultural e artística."
    photoUrl: "https://github.com/cumbucadev/NOSS/raw/2026-atualiza-grade/2026/assets/images/participantes/paloma-oliveira.jpeg"
    pronouns: "ela/dela"
    linkedIn: "https://www.linkedin.com/in/discombobulateme/"
    github: "https://github.com/discombobulateme"
    lecture:
      title: "A infraestrutura digital é global, e o Brasil faz parte dela"
      description: "A maior parte do software que governa a vida moderna é invisível. Está no firmware do roteador, no sistema de navegação do avião, no chip do cartão bancário, no kernel do telefone. E quase todo ele é construído sobre componentes de código aberto. Um estudo da Harvard Business School* estima que, se as empresas ao redor do mundo tivessem que reconstruir essa infraestrutura por conta própria, o custo chegaria a 8,8 trilhões de dólares. O software livre não é apenas uma escolha técnica: é um bem comum global, e como todo bem comum, precisa de manutenção.\n\nA Sovereign Tech Agency é uma agência pública alemã que foi uma das primeiras a nomear e operacionalizar esse entendimento: FOSS como infraestrutura digital. Criada em 2022 e financiada pelo Ministério Federal de Economia da Alemanha, a agência parte de um diagnóstico claro — o mercado não sustenta os componentes que todos usam mas ninguém paga. Bibliotecas de software, protocolos, ferramentas de desenvolvimento: esses componentes sustentam 97% do código comercial existente no mundo, e ainda assim as pessoas que os mantêm trabalham, em geral, com pouco reconhecimento e menos recursos.\n\nPara responder a esse problema, a agência desenvolveu um conjunto de programas complementares: o Sovereign Tech Fund, que investe diretamente em projetos de infraestrutura digital aberta; o Sovereign Tech Fellowship, que apoia individualmente maintainers que exercem um papel estrutural no ecossistema; o Sovereign Tech Resilience, que trabalha a segurança de forma proativa; e o Sovereign Tech Standards, que aproxima quem escreve padrões abertos de quem os implementa. Outros programas surgirão conforme as lacunas do ecossistema exigirem.\n\nNesta palestra, vou contar de onde veio esse trabalho, o que nos orienta e por que uma agência europeia investe globalmente, incluindo projetos mantidos por pessoas no Brasil. Os programas estão abertos a maintainers de qualquer lugar do mundo. O ecossistema é global, e as pessoas que o sustentam também deveriam ter acesso às estruturas que reconhecem esse trabalho."
      topics:
        - "O que é a Sovereign Tech Agency"
        - "Como ela define infraestrutura digital aberta como bem público"
        - "Quais programas existem"
        - "Como candidatar um projeto ou individualmente"
      infos:
        typeOfLecture: "Keynote"
        category: "Outro"
        nivel: "Iniciante"
        experienceOnOpenSource: "Básico"
        language: "Português"
